; Mom's Pie logo tool settings

; How the image is placed on the 512x512 sign texture:
;   Fit     = keep proportions, empty space stays transparent (recommended)
;   Fill    = keep proportions, fill the whole square, edges are cropped
;   Stretch = stretch to exactly 512x512 (may distort the image)
Mode=Fit

; Empty space around the logo, in percent (0 - 45). Increase it if the logo looks too big on the sign.
Margin=0

; Path to your hane_mpie_base resource folder.
; Leave empty: the tool finds it automatically (or asks you to drag & drop it).
BasePath=
